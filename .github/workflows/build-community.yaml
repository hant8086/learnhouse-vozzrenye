name: Build Community Images

# The image only ever contains apps/web, apps/collab and apps/api (see
# Dockerfile). A README edit or a CLI-only change cannot alter the image, so it
# does not need one. Deliberately a deny-list rather than an allow-list:
# anything new at the repo root still triggers a build. The list is spelled out
# twice because GitHub Actions does not support YAML anchors — keep both copies
# in sync.
# Vozzrenye fork: build our own image on pushes to `prod` only (our production
# branch = upstream release + our edits). Manual runs via workflow_dispatch.
on:
  workflow_dispatch:
  push:
    branches:
      - prod
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apps/cli/**'
      - 'apps/e2e/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

permissions:
  contents: read
  packages: write

# See api-lint.yaml — one live run per PR, dev runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Vozzrenye fork: push to OUR GHCR namespace (github.actor/GITHUB_TOKEN can only
  # write packages under this repo's owner). Resolves to hant8086/learnhouse-vozzrenye.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare platform pair
        id: prep
        run: |
          echo "platform_pair=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      # Vozzrenye build stamp: BASE = upstream release from apps/web/package.json;
      # BUILD = <run_number>-<sha7> (auto-increments each build, ties to the commit).
      - name: Compute build stamp
        id: stamp
        run: |
          BASE=$(node -p "require('./apps/web/package.json').version")
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "build=${{ github.run_number }}-$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            LEARNHOUSE_PUBLIC=true
            VOZZRENYE_BASE=${{ steps.stamp.outputs.base }}
            VOZZRENYE_BUILD=${{ steps.stamp.outputs.build }}
          cache-from: type=gha,scope=${{ steps.prep.outputs.platform_pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.platform_pair }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.prep.outputs.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create multi-platform manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH="${{ github.ref_name }}"

          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BRANCH}-${SHA_SHORT}"
          TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BRANCH}"

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | xargs -I{} echo "-t {}" | tr '\n' ' ')
          docker buildx imagetools create $TAGS \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
